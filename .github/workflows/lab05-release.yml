# Promote the tested :test image to production on tag push (GitHub flow release).
#
# GitHub flow: a release is tagging a commit on `main` with `lab05-vX.Y.Z`
# (namespaced: one fork hosts every lab, so a bare `v*` tag would fire every
# lab's release). That tag
# fires this workflow. We do NOT promote by rebuilding from the tagged commit —
# we promote the image currently running on test (the `:test` tag, which
# `deploy.yml` published from `main`). "Ship exactly what test validated": a
# rebuild could pull a newer base layer and ship bytes the test gateway never tested.
#
# The image-based payoff: we do NOT rebuild. The `:test` image is RE-TAGGED to
# :vX.Y.Z (the tag minus its `lab05-` prefix) + :production with a server-side
# manifest copy (`docker buildx imagetools create`): same bytes, same digest
# test ran. Recreating the production gateway from it is up to you.
#
# Before it re-tags, the job checks that `:test` really is the tagged commit:
# the image's org.opencontainers.image.revision label must name a commit whose
# image inputs (projects/, services/, third-party-modules/, Dockerfile,
# .dockerignore) are identical to the tagged commit's. Tagging an older
# commit, or tagging before lab05-deploy.yml has finished building the latest
# merge, fails the release instead of shipping a different image.
#
# One job, on a free GitHub-hosted runner:
#   promote (ubuntu-latest)  check :test, re-tag :test → :vX.Y.Z + :production  (no rebuild)
#
# There is deliberately NO deploy job. Pointing the production gateway at the promoted
# tag is done by hand (IGNITION_PRODUCTION_IMAGE + `docker compose up -d
# ignition-production`) — this lab runs no self-hosted runner.
#
# Triggers on tags matching `lab05-v*` (e.g. lab05-v1.0.0). Also supports manual dispatch
# with a version input — that's the rollback button: re-promote any ALREADY
# RELEASED version's image (:vX.Y.Z) back to production without touching git.
#
# Add required reviewers on a GitHub environment if you want a manual approval
# gate before production releases — common pattern, no workflow change needed.

name: Lab 05 · Release

on:
  push:
    tags: ['lab05-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Already-released version to re-promote to production (e.g. v1.0.0 or lab05-v1.0.0)'
        required: true
        type: string

concurrency:
  group: lab05-promote-production-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # No validation job here: you tag a commit that is already on main, and it
  # passed ci.yml on the PR that merged it (and deploy.yml built its image).
  # The tag chooses which validated, already-built image is promoted; only
  # tag commits that came through a PR.
  promote:
    name: Promote tested image to production tag
    # Fork-only: this job pushes tags to the fork owner's GHCR namespace, so it
    # skips on the course repo Mustry-Academy/cicd-for-ignition itself.
    if: github.repository != 'Mustry-Academy/cicd-for-ignition'
    runs-on: ubuntu-latest
    steps:
      # Full history, so the revision check below can compare the tagged
      # commit with the commit :test was built from. Only a tag push needs it.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Compute source + target tags
        id: meta
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          base="${REGISTRY}/${owner}/cicd-lab-05-ignition"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            # Manual dispatch = rollback / re-promote: the source is an image that
            # was ALREADY released under :vX.Y.Z. We re-point :production at it.
            version="${{ github.event.inputs.tag }}"
            version="${version#lab05-}"
            source="${base}:${version}"
          else
            # Tag push = new release: promote whatever the test gateway is running right now.
            # The image gets the bare semver (lab05-v1.0.0 → :v1.0.0).
            version="${{ github.ref_name }}"
            version="${version#lab05-}"
            source="${base}:test"
          fi
          {
            echo "base=${base}"
            echo "source=${source}"
            echo "version=${version}"
            echo "image=${base}:${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Promote ${source}  →  ${base}:${version} + ${base}:production"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that :test was built from the tagged commit
        # A tag push promotes whatever :test is right now. Make sure that is the
        # tagged commit's image, not an older or newer build.
        if: github.event_name == 'push'
        env:
          SOURCE: ${{ steps.meta.outputs.source }}
          TAGGED: ${{ github.sha }}
          LAB: labs/05-ignition-image-based-deploy
        run: |
          set -euo pipefail
          revs="$(docker buildx imagetools inspect "$SOURCE" --format '{{ json .Image }}' \
            | python3 -c 'import json,sys
          d = json.load(sys.stdin)
          imgs = [d] if "config" in d else list(d.values())
          print(" ".join(sorted({(i.get("config") or {}).get("Labels", {}).get("org.opencontainers.image.revision", "") for i in imgs})))')"
          case "$revs" in
            ""|*" "*|unknown)
              echo "::error::$SOURCE carries no single revision label (got '${revs}'). Rebuild it with lab05-deploy.yml."
              exit 1 ;;
          esac
          rev="$revs"
          echo "$SOURCE was built from $rev; the tag points at $TAGGED."
          if ! git cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::$SOURCE was built from $rev, which is not a commit in this repository."
            exit 1
          fi
          if ! git diff --quiet "$rev" "$TAGGED" -- \
              "$LAB/projects" "$LAB/services" "$LAB/third-party-modules" \
              "$LAB/Dockerfile" "$LAB/.dockerignore"; then
            echo "::error::$SOURCE was built from $rev, but the tagged commit ${TAGGED:0:7} has different image inputs. Wait for lab05-deploy.yml to finish building the tagged commit (or tag the commit :test was built from), then push the tag again."
            git diff --stat "$rev" "$TAGGED" -- "$LAB/projects" "$LAB/services" \
              "$LAB/third-party-modules" "$LAB/Dockerfile" "$LAB/.dockerignore" || true
            exit 1
          fi
          echo ":test holds the tagged commit's image inputs: promoting it."

      - name: Re-tag the tested image (no rebuild)
        # imagetools copies the manifest server-side: the production tags point at the
        # exact same digest the test gateway tested. If this fails with "not found":
        #   - new release → there is no :test image yet; push to `main` so
        #     deploy.yml builds and ships one first.
        #   - rollback → that version was never released (no :vX.Y.Z image).
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ steps.meta.outputs.image }}" \
            --tag "${{ steps.meta.outputs.base }}:production" \
            "${{ steps.meta.outputs.source }}"

      - name: Tell me how to deploy this release
        # No deploy job in this lab — promoting a release is a registry
        # operation, and pointing production at the promoted tag is done by hand.
        run: |
          {
            echo "### Released ${{ steps.meta.outputs.version }}"
            echo
            echo "Same digest the test gateway tested, now tagged:"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}"
            echo "${{ steps.meta.outputs.base }}:production"
            echo '```'
            echo
            echo "Deploy it to your production gateway by hand:"
            echo
            echo '```bash'
            echo "docker pull ${{ steps.meta.outputs.image }}"
            echo "IGNITION_PRODUCTION_IMAGE=${{ steps.meta.outputs.image }} \\"
            echo "  docker compose up -d ignition-production"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
